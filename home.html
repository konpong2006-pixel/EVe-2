<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evee Vault - Our Memories 🤎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Playfair+Display:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #FDFBF7; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .heart-beat { animation: heartbeat 1.5s infinite; }
        .fade-out { opacity: 0; pointer-events: none; transition: opacity 0.8s ease; }
        .memory-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .memory-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(111, 78, 55, 0.1); }
    </style>
</head>
<body class="text-[#5D4037]">

    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#FDFBF7]">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-[#6F4E37] heart-beat" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>

    <nav class="px-6 py-4 flex justify-between items-center sticky top-0 bg-[#FDFBF7]/80 backdrop-blur-md z-40 border-b border-[#E7DCD3]/30">
        <h1 class="serif text-xl italic font-bold text-[#6F4E37]">Evee.</h1>
        <a href="add.html" class="flex items-center gap-2 bg-[#6F4E37] text-white px-4 py-2 rounded-full text-[9px] font-bold uppercase tracking-widest shadow-md hover:bg-[#5D4037] transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4" />
            </svg>
            Add Memory
        </a>
    </nav>

    <header class="max-w-4xl mx-auto text-center py-12 px-6">
        <h2 class="serif text-4xl md:text-5xl mb-3 italic text-[#6F4E37]">The Gallery of Us</h2>
        <div class="h-[1px] w-12 bg-[#D4A373] mx-auto mb-4"></div>
        <p class="text-[#8D6E63] italic text-[13px] md:text-sm max-w-md mx-auto leading-relaxed">
            "ทุกรูปภาพคือหนึ่งหน้ากระดาษในเรื่องราวของเรา"
        </p>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div id="memory-display" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <footer class="text-center py-12 border-t border-[#E7DCD3]/50 bg-white/30">
        <div class="serif italic text-[#6F4E37] text-lg mb-1">Forever Yours.</div>
        <p class="text-[8px] uppercase tracking-[0.4em] text-[#A67B5B]">Captured for Evee</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBa7eT4nHVYZfBZw3wStFgBl-Hyw-RsAH0",
            authDomain: "evee-29429.firebaseapp.com",
            projectId: "evee-29429",
            storageBucket: "evee-29429.firebasestorage.app",
            messagingSenderId: "304141311078",
            appId: "1:304141311078:web:a13ea36d278047ef28e1a7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(query(collection(db, "memories"), orderBy("createdAt", "desc")), (snapshot) => {
            const display = document.getElementById('memory-display');
            let html = "";
            if (snapshot.empty) {
                html = `<div class="col-span-full text-center py-10 text-[#A67B5B] italic text-xs tracking-widest">ยังไม่มีความทรงจำในนี้...</div>`;
            } else {
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    html += `
                        <article class="memory-card bg-white rounded-3xl p-4 shadow-sm border border-[#E7DCD3]/40">
                            <div class="aspect-square rounded-2xl overflow-hidden mb-4 bg-[#FDFBF7]">
                                <img src="${data.imageUrl}" class="w-full h-full object-cover">
                            </div>
                            <div class="px-1">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="serif text-lg text-[#6F4E37] font-bold">${data.title}</h4>
                                    <span class="text-[8px] text-[#A67B5B]">${data.createdAt?.toDate ? data.createdAt.toDate().toLocaleDateString('th-TH') : ''}</span>
                                </div>
                                <p class="text-xs text-[#8D6E63] leading-relaxed line-clamp-2 italic">"${data.description || ""}"</p>
                            </div>
                        </article>
                    `;
                });
            }
            display.innerHTML = html;
        });

        window.addEventListener('load', () => setTimeout(() => document.getElementById('loader').classList.add('fade-out'), 1000));
    </script>
</body>
</html>
