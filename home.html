<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Evee Vault 🤎 (Free Version)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Playfair+Display:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #FDFBF7; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        .loading-fade { opacity: 0; pointer-events: none; transition: all 1s ease; }
    </style>
</head>
<body class="text-[#5D4037]">

    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#FDFBF7]">
        <div class="w-12 h-12 border-4 border-[#D4A373]/20 border-t-[#6F4E37] rounded-full animate-spin"></div>
        <p class="mt-4 serif italic text-[#A67B5B] animate-pulse">Loading Our Memories...</p>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-[#FDFBF7]/90 backdrop-blur-md z-40 border-b border-[#E7DCD3]/50">
        <h1 class="serif text-2xl italic font-bold text-[#6F4E37]">Evee.</h1>
        <a href="#upload-section" class="text-[10px] font-bold uppercase tracking-widest bg-[#6F4E37] text-white px-4 py-2 rounded-full shadow-md">Add New</a>
    </nav>

    <header class="text-center py-16 px-4">
        <h2 class="serif text-5xl mb-4 italic text-[#6F4E37]">Our Journey</h2>
        <p class="text-[#8D6E63] italic text-sm">"ใช้แค่ Firestore ก็เก็บความทรงจำได้ฟรีๆ"</p>
    </header>

    <section id="upload-section" class="max-w-xl mx-auto px-6 mb-20">
        <div class="bg-white p-8 rounded-3xl border border-[#E7DCD3] shadow-sm">
            <h3 class="serif text-xl text-[#6F4E37] mb-6 text-center italic font-bold">เพิ่มความทรงจำใหม่</h3>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-[#A67B5B] font-bold block mb-2">ลิงก์รูปภาพ (Image URL)</label>
                    <input type="text" id="imageUrlInput" placeholder="https://example.com/photo.jpg" 
                        class="w-full p-4 rounded-xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] text-sm">
                    <p class="text-[9px] text-[#A67B5B] mt-1">* ก๊อปปี้ลิงก์รูปมาวางได้เลยจ้า</p>
                </div>
                
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-[#A67B5B] font-bold block mb-2">หัวข้อ</label>
                    <input type="text" id="titleInput" placeholder="วันนี้ทำอะไรกันนะ?" 
                        class="w-full p-4 rounded-xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] text-sm">
                </div>

                <div>
                    <label class="text-[10px] uppercase tracking-widest text-[#A67B5B] font-bold block mb-2">บันทึกสั้นๆ</label>
                    <textarea id="descInput" placeholder="เขียนข้อความถึงกัน..." 
                        class="w-full p-4 rounded-xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] h-24 text-sm"></textarea>
                </div>

                <button onclick="saveToFirestore()" id="saveBtn" class="w-full py-4 bg-[#6F4E37] text-white rounded-xl font-bold shadow-lg hover:bg-[#5D4037] transition-all">
                    Save Memory
                </button>
            </div>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-6 pb-32">
        <div id="memory-display" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Config ของคุณ (อันเดิม)
        const firebaseConfig = {
            apiKey: "AIzaSyBa7eT4nHVYZfBZw3wStFgBl-Hyw-RsAH0",
            authDomain: "evee-29429.firebaseapp.com",
            projectId: "evee-29429",
            storageBucket: "evee-29429.firebasestorage.app",
            messagingSenderId: "304141311078",
            appId: "1:304141311078:web:a13ea36d278047ef28e1a7",
            measurementId: "G-C8LE0SNFVB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ฟังก์ชันบันทึกข้อมูล (เฉพาะข้อความและลิงก์)
        window.saveToFirestore = async () => {
            const imageUrl = document.getElementById('imageUrlInput').value;
            const title = document.getElementById('titleInput').value;
            const desc = document.getElementById('descInput').value;
            const btn = document.getElementById('saveBtn');

            if(!imageUrl || !title) return alert("ใส่ลิงก์รูปกับหัวข้อด้วยนะจ๊ะ!");

            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "memories"), {
                    imageUrl: imageUrl,
                    title: title,
                    description: desc,
                    createdAt: new Date()
                });
                alert("บันทึกสำเร็จ! ✨");
                document.getElementById('imageUrlInput').value = "";
                document.getElementById('titleInput').value = "";
                document.getElementById('descInput').value = "";
            } catch (e) {
                alert("เกิดข้อผิดพลาด: " + e.message);
            } finally {
                btn.innerText = "Save Memory";
                btn.disabled = false;
            }
        };

        // ดึงข้อมูลมาโชว์ (Real-time)
        onSnapshot(query(collection(db, "memories"), orderBy("createdAt", "desc")), (snapshot) => {
            const display = document.getElementById('memory-display');
            let html = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `
                    <div class="bg-white p-4 rounded-3xl border border-[#E7DCD3] shadow-sm overflow-hidden">
                        <img src="${data.imageUrl}" class="w-full h-64 object-cover rounded-2xl mb-4 shadow-inner" onerror="this.src='https://via.placeholder.com/400x400?text=Invalid+Image+URL'">
                        <h4 class="serif text-xl text-[#6F4E37] font-bold">${data.title}</h4>
                        <p class="text-sm text-[#8D6E63] mt-2">${data.description || ""}</p>
                    </div>
                `;
            });
            display.innerHTML = html;
        });

        window.addEventListener('load', () => {
            setTimeout(() => document.getElementById('loader').classList.add('loading-fade'), 1000);
        });
    </script>
</body>
</html>
