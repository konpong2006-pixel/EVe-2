<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Evee Vault 🤎</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600&family=Playfair+Display:italic,wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #FDFBF7; scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        .heart-beat { animation: heartbeat 1.2s infinite; }
        .loading-fade { opacity: 0; pointer-events: none; transition: all 1s ease; }
    </style>
</head>
<body class="text-[#5D4037]">

    <div id="loader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#FDFBF7]">
        <div class="relative flex items-center justify-center">
            <div class="w-20 h-20 border-2 border-[#D4A373]/20 border-t-[#6F4E37] rounded-full animate-spin"></div>
            <div class="absolute"><svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-[#6F4E37] heart-beat" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
        </div>
        <p class="mt-4 serif italic text-[#A67B5B] tracking-widest animate-pulse">Opening Evee Vault...</p>
    </div>

    <nav class="p-6 flex justify-between items-center sticky top-0 bg-[#FDFBF7]/90 backdrop-blur-md z-40 border-b border-[#E7DCD3]/50">
        <h1 class="serif text-2xl italic font-bold text-[#6F4E37]">Evee.</h1>
        <div class="flex gap-4">
            <a href="#upload-section" class="text-[10px] font-bold uppercase tracking-widest bg-[#6F4E37] text-white px-4 py-2 rounded-full hover:bg-[#A67B5B] transition shadow-md">Add Memory</a>
        </div>
    </nav>

    <header class="text-center py-20 px-4">
        <span class="text-[10px] uppercase tracking-[0.4em] text-[#A67B5B] mb-2 block font-bold">Memory Collector</span>
        <h2 class="serif text-5xl md:text-6xl mb-4 italic text-[#6F4E37]">Our Journey</h2>
        <p class="text-[#8D6E63] italic">"ทุกความทรงจำ... มีความหมายเสมอ"</p>
    </header>

    <section id="upload-section" class="max-w-xl mx-auto px-6 mb-20">
        <div class="bg-white p-8 rounded-3xl border border-[#E7DCD3] shadow-sm">
            <h3 class="serif text-2xl text-[#6F4E37] mb-6 text-center italic font-bold">New Memory</h3>
            <div class="space-y-4">
                <div class="border-2 border-dashed border-[#E7DCD3] p-4 rounded-xl text-center bg-[#FDFBF7]">
                    <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-[#8D6E63] cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-[#6F4E37] file:text-white hover:file:bg-[#A67B5B]"/>
                </div>
                <input type="text" id="titleInput" placeholder="หัวข้อ (เช่น วันนี้ไปคาเฟ่กัน)" class="w-full p-4 rounded-xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] text-sm text-[#5D4037]">
                <textarea id="descInput" placeholder="เขียนบันทึกเล็กๆ ถึงกัน..." class="w-full p-4 rounded-xl bg-[#FDFBF7] border border-[#E7DCD3] focus:outline-none focus:ring-1 focus:ring-[#A67B5B] h-28 text-sm text-[#5D4037]"></textarea>
                <button onclick="uploadMemory()" id="uploadBtn" class="w-full py-4 bg-[#6F4E37] text-white rounded-xl font-bold shadow-lg hover:bg-[#5D4037] transition-all flex justify-center items-center gap-2">
                    Post to Vault
                </button>
            </div>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-6 pb-32">
        <div class="flex items-center gap-4 mb-10">
            <div class="h-[1px] bg-[#E7DCD3] flex-1"></div>
            <h3 class="serif italic text-[#A67B5B]">Timeline</h3>
            <div class="h-[1px] bg-[#E7DCD3] flex-1"></div>
        </div>
        <div id="memory-display" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            </div>
    </main>

    <footer class="text-center py-20 border-t border-[#E7DCD3] bg-white">
        <div class="serif italic text-[#6F4E37] text-xl mb-2">Forever & Always</div>
        <p class="text-[9px] uppercase tracking-[0.4em] text-[#A67B5B]">Made with love for Evee</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase Config ของคุณ
        const firebaseConfig = {
            apiKey: "AIzaSyBa7eT4nHVYZfBZw3wStFgBl-Hyw-RsAH0",
            authDomain: "evee-29429.firebaseapp.com",
            projectId: "evee-29429",
            storageBucket: "evee-29429.firebasestorage.app",
            messagingSenderId: "304141311078",
            appId: "1:304141311078:web:a13ea36d278047ef28e1a7",
            measurementId: "G-C8LE0SNFVB"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- ฟังก์ชันอัปโหลด ---
        window.uploadMemory = async () => {
            const file = document.getElementById('imageInput').files[0];
            const title = document.getElementById('titleInput').value;
            const desc = document.getElementById('descInput').value;
            const btn = document.getElementById('uploadBtn');

            if(!file || !title) return alert("อย่าลืมเลือกรูปและใส่หัวข้อด้วยนะจ๊ะ ❤️");

            btn.innerText = "กำลังอัปโหลด... ⏳";
            btn.disabled = true;

            try {
                const storageRef = ref(storage, 'memories/' + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);

                await addDoc(collection(db, "memories"), {
                    title: title,
                    description: desc,
                    imageUrl: url,
                    createdAt: new Date()
                });

                alert("บันทึกความทรงจำสำเร็จแล้ว! ✨");
                document.getElementById('imageInput').value = "";
                document.getElementById('titleInput').value = "";
                document.getElementById('descInput').value = "";
            } catch (e) {
                console.error(e);
                alert("อุ๊ย! มีบางอย่างผิดพลาด: " + e.message);
            } finally {
                btn.innerText = "Post to Vault";
                btn.disabled = false;
            }
        };

        // --- ดึงข้อมูลแบบ Real-time ---
        onSnapshot(query(collection(db, "memories"), orderBy("createdAt", "desc")), (snapshot) => {
            const display = document.getElementById('memory-display');
            let html = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                html += `
                    <div class="group bg-white p-4 rounded-3xl border border-[#E7DCD3] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-500">
                        <div class="aspect-square rounded-2xl overflow-hidden mb-6">
                            <img src="${data.imageUrl}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700 group-hover:scale-110">
                        </div>
                        <div class="px-2">
                            <h4 class="serif text-2xl text-[#6F4E37] mb-2 font-bold">${data.title}</h4>
                            <p class="text-sm text-[#8D6E63] leading-relaxed mb-4">${data.description || ""}</p>
                            <div class="h-[1px] bg-[#FDFBF7] w-full mb-2"></div>
                            <span class="text-[9px] text-[#A67B5B] uppercase tracking-widest">${data.createdAt?.toDate().toLocaleDateString('th-TH', {month: 'long', year: 'numeric'})}</span>
                        </div>
                    </div>
                `;
            });
            display.innerHTML = html;
        });

        // --- ปิดหน้า Loader ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('loading-fade');
            }, 1500);
        });
    </script>
</body>
</html>
